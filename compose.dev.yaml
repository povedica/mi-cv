services:
  web:
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./tests
          target: /app/tests
        - action: sync
          path: ./knowledge/publication.mjs
          target: /app/knowledge/publication.mjs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./astro.config.mjs
        - action: rebuild
          path: ./tsconfig.json
