services:
  web:
    build: .
    init: true
    environment:
      PUBLIC_SENTRY_DSN: "${PUBLIC_SENTRY_DSN:-}"
    ports:
      - "127.0.0.1:${MI_CV_HOST_PORT:-4321}:4321"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/', { method: 'HEAD', signal: AbortSignal.timeout(2000) }).then(response => { if (!response.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./tests
          target: /app/tests
        - action: sync
          path: ./knowledge/publication.mjs
          target: /app/knowledge/publication.mjs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./astro.config.mjs
        - action: rebuild
          path: ./tsconfig.json
