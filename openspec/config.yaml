schema: spec-driven

context: |
  Write technical artifacts in English. The product interface is Spanish.
  Follow the editorial and privacy constraints in AGENTS.md and the issue lifecycle in docs/backlog/PROTOCOLO-BACKLOG.md.
  Link the GitHub issue when available. Keep public artifacts free of unpublished facts, credentials and private records.
  Use synthetic examples when describing or testing editorial data.

rules:
  tasks:
    - Group work into verifiable changes that can become focused commits.
